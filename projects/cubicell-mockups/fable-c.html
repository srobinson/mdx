<!-- IDEA C: State motion and camera stop being two stacked widgets and become one instrument: a single ruler, a single playhead, and two parallel lanes laid out on real time, so a camera move visibly spans the states it films. Selection feeds a slim context bar; the timeline itself never grows property rows. -->
<meta charset="utf-8">
<title>Cubicell · Camera Track C · Unified Score</title>
<style>
  :root {
    --bg: #050505;
    --panel: #0d0d0d;
    --border: rgba(255,255,255,0.16);
    --border-strong: rgba(255,255,255,0.4);
    --fg: #f2f2f2;
    --muted: rgba(255,255,255,0.52);
    --accent: #e87d0d;
    --mono: "Geist Mono", "Roboto Mono", "Cascadia Code", Menlo, monospace;
    --ui: "Avenir Next", "DIN Alternate", "Trebuchet MS", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--ui);
    padding: 28px 24px 48px; -webkit-font-smoothing: antialiased;
  }
  .frame { max-width: 1560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

  /* transport */
  .transport { display: flex; align-items: center; gap: 10px; }
  .tbtn {
    font: 700 11px/1 var(--mono); letter-spacing: 0.08em; color: var(--fg);
    background: #101010; border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 14px; cursor: pointer;
  }
  .tbtn:hover { border-color: var(--border-strong); }
  .tbtn.active { border-color: var(--accent); color: var(--accent); }
  .tclock { font: 700 12px/1 var(--mono); color: var(--muted); white-space: nowrap; margin-left: auto; }
  .tclock b { color: var(--fg); }
  .tspeed { font: 700 12px/1 var(--mono); background: #101010; border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; }
  .capture {
    font: 700 11px/1 var(--mono); letter-spacing: 0.06em;
    background: #f2f2f2; color: #050505; border: 1px solid #f2f2f2; border-radius: 6px;
    padding: 9px 14px; cursor: pointer;
  }
  .capture:hover { background: #fff; }

  /* the score */
  .score {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: grid;
    grid-template-columns: 92px 1fr;
    overflow: hidden;
    position: relative;
  }
  .gutter {
    display: flex; align-items: center;
    padding: 0 14px;
    border-right: 1px solid rgba(255,255,255,0.09);
    font: 700 9px/1 var(--mono); letter-spacing: 0.16em; color: var(--muted);
  }
  .rail { position: relative; }
  .row-ruler { height: 30px; border-bottom: 1px solid rgba(255,255,255,0.09); }
  .row-states { height: 128px; border-bottom: 1px solid rgba(255,255,255,0.09); }
  .row-camera { height: 64px; }

  .ruler { position: relative; height: 100%; }
  .tick { position: absolute; bottom: 0; width: 1px; height: 6px; background: rgba(255,255,255,0.25); }
  .tick span {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    font: 700 9px/1 var(--mono); color: var(--muted); letter-spacing: 0.05em;
  }
  .gridline { position: absolute; top: 30px; bottom: 0; width: 1px; background: rgba(255,255,255,0.045); pointer-events: none; }

  /* state lane: blocks on real time */
  .states { position: relative; height: 100%; padding: 10px 0; }
  .block {
    position: absolute; top: 10px; bottom: 10px;
    border: 1px solid var(--border); border-radius: 6px; background: #111;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 8px 4px; overflow: hidden; cursor: pointer;
    transition: border-color 120ms;
  }
  .block:hover { border-color: var(--border-strong); }
  .block.selected { border-color: var(--accent); }
  .block .h { font: 800 9px/1 var(--ui); letter-spacing: 0.05em; white-space: nowrap; }
  .block .thumb { width: 46px; height: 42px; background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 3px; flex: 0 0 auto; }
  .block .c { font: 700 8px/1 var(--mono); color: var(--muted); white-space: nowrap; }
  .block.trans { background: #0b0b0b; justify-content: center; gap: 6px; }
  .block.trans .h { color: var(--muted); }
  .block.trans .kind { font: 800 9px/1 var(--ui); letter-spacing: 0.06em; }
  .block.narrow .h, .block.narrow .c { transform: rotate(0); font-size: 8px; }

  /* camera lane */
  .camera { position: relative; height: 100%; }
  .cam-baseline { position: absolute; left: 0; right: 0; top: 31px; height: 2px; background: rgba(255,255,255,0.1); }
  .seg {
    position: absolute; top: 22px; height: 18px;
    border: 1px solid rgba(255,255,255,0.22); border-radius: 4px; background: #0a0a0a;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font: 700 9px/1 var(--mono); letter-spacing: 0.08em; color: var(--muted);
    cursor: pointer; transition: border-color 120ms, color 120ms; overflow: hidden;
  }
  .seg:hover { border-color: var(--border-strong); color: var(--fg); }
  .seg.selected { border-color: var(--accent); color: var(--fg); }
  .key {
    position: absolute; top: 32px; width: 11px; height: 11px;
    transform: translate(-50%, -50%) rotate(45deg);
    background: #0d0d0d; border: 1.5px solid #fff; border-radius: 2px;
    cursor: pointer; z-index: 2;
  }
  .key:hover { background: #222; }
  .key.selected { border-color: var(--accent); background: var(--accent); }
  .key-time {
    position: absolute; top: 46px; transform: translateX(-50%);
    font: 700 8px/1 var(--mono); color: var(--muted); letter-spacing: 0.05em; pointer-events: none;
  }

  /* one playhead across everything */
  .playhead {
    position: absolute; top: 0; bottom: 0; left: calc(92px + (100% - 92px - 24px) * 0.394 + 12px);
    width: 1px; background: #fff; z-index: 5; pointer-events: none;
    box-shadow: 0 0 8px rgba(255,255,255,0.35);
  }
  .playhead::before {
    content: ""; position: absolute; top: 0; left: -5px;
    border-left: 5.5px solid transparent; border-right: 5.5px solid transparent; border-top: 7px solid #fff;
  }

  /* context bar: selection summary, edits stay out of the lanes */
  .context {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px;
  }
  .ctx-what { font: 700 10px/1 var(--mono); letter-spacing: 0.1em; color: var(--accent); }
  .ctx-chip {
    font: 700 10px/1 var(--mono); letter-spacing: 0.05em; color: var(--fg);
    border: 1px solid var(--border); border-radius: 5px; padding: 7px 10px;
    background: #0a0a0a; cursor: pointer;
  }
  .ctx-chip:hover { border-color: var(--border-strong); }
  .ctx-chip span { color: var(--muted); margin-right: 6px; }
  .ctx-open { margin-left: auto; font: 700 10px/1 var(--mono); letter-spacing: 0.08em; color: var(--muted); background: none; border: none; cursor: pointer; }
  .ctx-open:hover { color: var(--fg); }
</style>

<div class="frame">

  <div class="transport">
    <button class="tbtn">PLAY</button>
    <button class="tbtn">STOP</button>
    <button class="tbtn active">LOOP</button>
    <button class="capture" style="margin-left:6px">CAPTURE VIEW AT 1.3S</button>
    <span class="tclock"><b>1.3s</b> / 3.3s</span>
    <span class="tspeed">1.00&times;</span>
  </div>

  <div class="score">

    <!-- lane gutters -->
    <div class="gutter" style="grid-row:1; height:30px; border-bottom:1px solid rgba(255,255,255,0.09)"></div>
    <div class="rail row-ruler" style="grid-row:1">
      <div class="ruler" style="padding-right:24px; margin: 0 12px;">
        <div class="tick" style="left:0%"><span>0.0S</span></div>
        <div class="tick" style="left:15.15%"><span>0.5S</span></div>
        <div class="tick" style="left:30.3%"><span>1.0S</span></div>
        <div class="tick" style="left:45.45%"><span>1.5S</span></div>
        <div class="tick" style="left:60.6%"><span>2.0S</span></div>
        <div class="tick" style="left:75.75%"><span>2.5S</span></div>
        <div class="tick" style="left:90.9%"><span>3.0S</span></div>
        <div class="tick" style="left:100%"><span>3.3S</span></div>
      </div>
    </div>

    <div class="gutter row-states" style="grid-row:2; border-bottom:1px solid rgba(255,255,255,0.09)">STATES</div>
    <div class="rail row-states" style="grid-row:2">
      <div class="states" style="margin: 0 12px; padding-right: 24px;">
        <div class="block" data-sel style="left:0%; width:8.6%">
          <span class="h">BUILD IN</span><div class="thumb"></div><span class="c">0.0S</span>
        </div>
        <div class="block" data-sel style="left:9.1%; width:8.6%">
          <span class="h">STATE 1</span><div class="thumb"></div><span class="c"></span>
        </div>
        <div class="block trans" data-sel style="left:18.2%; width:8.6%">
          <span class="h">TRANS</span><span class="kind">Z</span><span class="c">300MS</span>
        </div>
        <div class="block" data-sel style="left:27.3%; width:8.6%">
          <span class="h">STATE 2</span><div class="thumb"></div><span class="c"></span>
        </div>
        <div class="block trans" data-sel style="left:36.4%; width:10.1%">
          <span class="h">TRANS</span><span class="kind">MADE</span><span class="c">350MS</span>
        </div>
        <div class="block selected" data-sel style="left:47%; width:8.5%">
          <span class="h">STATE 3</span><div class="thumb"></div><span class="c"></span>
        </div>
        <div class="block trans" data-sel style="left:56%; width:10.2%">
          <span class="h">TRANS</span><span class="kind">SHELL</span><span class="c">350MS</span>
        </div>
        <div class="block" data-sel style="left:66.7%; width:8.6%">
          <span class="h">STATE 4</span><div class="thumb"></div><span class="c"></span>
        </div>
        <div class="block trans" data-sel style="left:75.8%; width:7%">
          <span class="h">TRANS</span><span class="kind">RADIAL</span><span class="c">250MS</span>
        </div>
        <div class="block" data-sel style="left:83.3%; width:16.7%">
          <span class="h">STATE 5</span><div class="thumb"></div><span class="c"></span>
        </div>
      </div>
    </div>

    <div class="gutter row-camera" style="grid-row:3">CAMERA</div>
    <div class="rail row-camera" style="grid-row:3">
      <div class="camera" style="margin: 0 12px; padding-right: 24px;">
        <div class="cam-baseline"></div>

        <div class="seg" data-sel style="left:calc(0% + 7px); width:calc(21.2% - 14px)">
          <svg width="14" height="9" viewBox="0 0 14 9"><path d="M1 8 A 7 7 0 0 1 13 8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          ORBIT
        </div>
        <div class="seg" data-sel style="left:calc(21.2% + 7px); width:calc(18.2% - 14px)">
          <svg width="14" height="9" viewBox="0 0 14 9"><line x1="1" y1="8" x2="13" y2="1" stroke="currentColor" stroke-width="1.3"/></svg>
          LINEAR
        </div>
        <div class="seg" data-sel style="left:calc(39.4% + 7px); width:calc(6% - 14px)">
          <svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 8 h4 v-7 h5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </div>
        <div class="seg" data-sel style="left:calc(45.4% + 7px); width:calc(39.4% - 14px)">
          <svg width="14" height="9" viewBox="0 0 14 9"><path d="M1 8 A 7 7 0 0 1 13 8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
          ORBIT &middot; -380&deg; &middot; OUT
        </div>

        <div class="key" data-sel style="left:0%"></div><span class="key-time" style="left:0%">1</span>
        <div class="key" data-sel style="left:21.2%"></div><span class="key-time" style="left:21.2%">2</span>
        <div class="key selected" data-sel style="left:39.4%"></div><span class="key-time" style="left:39.4%">3</span>
        <div class="key" data-sel style="left:45.4%"></div><span class="key-time" style="left:45.4%">4</span>
        <div class="key" data-sel style="left:84.8%"></div><span class="key-time" style="left:84.8%">5</span>
      </div>
    </div>

    <div class="playhead"></div>
  </div>

  <div class="context">
    <span class="ctx-what">VIEW 3 &middot; 1.3S</span>
    <button class="ctx-chip"><span>MS</span>1300</button>
    <button class="ctx-chip"><span>PROJ</span>ORTHO</button>
    <button class="ctx-chip"><span>OUT</span>CUT &middot; POSE 0.50</button>
    <button class="ctx-chip">REMOVE VIEW</button>
    <button class="ctx-open">FULL PROPERTIES IN INSPECTOR &rarr;</button>
  </div>

</div>

<script>
  document.querySelectorAll('[data-sel]').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('[data-sel]').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
    });
  });
</script>
